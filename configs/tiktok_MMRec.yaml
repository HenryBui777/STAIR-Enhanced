root: data
dataset: tiktok

embedding_dim: 64
num_layers: 3

epochs: 500
batch_size: 1024
optimizer: adamwsevo
lr: 1.e-3
weight_decay: 0.1

# Content-driven micro-video scenario: smaller gamma (0.01 - 0.05) preserves richer multimodal cues in FSC
gamma: 0.05

# Modality files & kNN neighbor settings (Tri-modal: Vision, Text, Audio)
mfiles: visual_modality.pkl,textual_modality.pkl,audio_modality.pkl
num_neighbors: '3-3-3'

monitors: [LOSS, Recall@1, Recall@10, Recall@20, NDCG@10, NDCG@20]
which4best: NDCG@20
