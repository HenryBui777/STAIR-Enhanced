root: data
dataset: Amazon2014Electronics_550_MMRec

embedding_dim: 64
num_layers: 3

epochs: 250
patience: 20
early_stop_warmup: 100
batch_size: 2048
optimizer: adamwsevo
lr: 1.e-3
weight_decay: 0.1

gamma: 0.4
mfiles: textual_modality.pkl,visual_modality.pkl
num_neighbors: '5-1'

monitors: [LOSS, Recall@1, Recall@10, Recall@20, NDCG@10, NDCG@20]
which4best: NDCG@20